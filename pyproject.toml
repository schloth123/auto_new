[project]
name = "auto-new"
version = "0.1.0"
description = "Utilities for copying invoice files from OneDrive share links"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
    "msal>=1.28.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
